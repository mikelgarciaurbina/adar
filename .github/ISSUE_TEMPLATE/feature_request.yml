name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
      description: How should it work? Mock-ups or references to other Git clients are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
