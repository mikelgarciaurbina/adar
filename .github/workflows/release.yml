# Builds Adar for macOS (Apple Silicon), Windows (x64) and Linux (x64) and publishes a GitHub Release when a
# version tag is pushed. The app's in-app updater reads the latest release, so:
#   1. update build/release-notes.md
#   2. npm version 0.4.0 && git push origin main --tags
# Each system is built on its own runner without publishing. The publish job then creates a single fresh DRAFT
# release (which the updater ignores), uploads every asset, checks that they are complete and match the builds,
# and only then publishes it. If any build fails, nothing is published.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Two runs for the same version (tag push + manual run) must not race on the same draft.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # Manual runs only from main (tag pushes build the tagged commit).
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - os: macos-latest
            script: dist
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Once, on macOS: the test suite has not been run on Windows and Linux yet.
      - name: Typecheck and test
        if: runner.os == 'macOS'
        run: |
          npm run typecheck
          npm test

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version $PKG"; exit 1
          fi

      - name: Build (no publishing)
        if: runner.os != 'macOS'
        run: npm run ${{ matrix.script }}

      # macOS is signed with the Developer ID certificate and notarized. The Apple secrets reach this step only (not
      # npm ci or the tests); a missing one, a certificate that is not mac.identity, or an app that is not signed,
      # notarized and stapled fails the build instead of publishing it.
      - name: Build, sign and notarize (no publishing)
        if: runner.os == 'macOS'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for v in MAC_CERT_P12_BASE64 MAC_CERT_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!v}" ] || { echo "::error::Missing secret for $v"; exit 1; }
          done
          # The certificate goes into a keychain of our own (CSC_KEYCHAIN), not through CSC_LINK: electron-builder 26
          # unlocks the keychain it creates with the certificate's password, which current macOS rejects.
          export CSC_KEYCHAIN="$RUNNER_TEMP/adar-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$CSC_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$CSC_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$CSC_KEYCHAIN"
          printf '%s' "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/adar-signing.p12"
          security import "$RUNNER_TEMP/adar-signing.p12" -k "$CSC_KEYCHAIN" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/adar-signing.p12"
          # Apple's intermediate that issues Developer ID certificates completes the chain.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$CSC_KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$CSC_KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$CSC_KEYCHAIN" $(security list-keychains -d user | xargs)
          # mac.identity in electron-builder.yml.
          security find-identity -v -p codesigning "$CSC_KEYCHAIN" |
            grep -F 'Developer ID Application: Mikel Garcia (54RSVZ573J)' ||
            { echo "::error::MAC_CERT_P12_BASE64 holds no valid Developer ID Application: Mikel Garcia (54RSVZ573J)"; exit 1; }
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          npm run ${{ matrix.script }}
          rm -f "$APPLE_API_KEY"
          APP=release/mac-arm64/Adar.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          SIGNATURE="$(codesign -dv --verbose=2 "$APP" 2>&1)"
          printf '%s\n' "$SIGNATURE" | grep -E '^(Authority|TeamIdentifier)='
          printf '%s\n' "$SIGNATURE" | grep -q '^Authority=Developer ID Application:'
          # The team of mac.identity in electron-builder.yml.
          printf '%s\n' "$SIGNATURE" | grep -qx 'TeamIdentifier=54RSVZ573J'
          spctl --assess --type execute --verbose=2 "$APP"
          xcrun stapler validate "$APP"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            release/Adar-*.dmg
            release/Adar-*.zip
            release/Adar-*.exe
            release/Adar-*.AppImage
            release/Adar-*.deb
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release, upload assets, publish
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create, verify and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="$(node -p "require('./package.json').version")"
          TAG="v$V"
          R="$GITHUB_REPOSITORY"
          # macOS keeps the arch-only names that installed apps (0.5.x) and the website look for; Windows and
          # Linux name their system and never ship a .zip or .dmg (see electron-builder.yml).
          FILES="Adar-$V-arm64.dmg Adar-$V-arm64.zip Adar-$V-win-x64.exe Adar-$V-linux-x86_64.AppImage Adar-$V-linux-amd64.deb"
          for f in $FILES; do [ -f "release/$f" ] || { echo "::error::release/$f was not built"; exit 1; }; done

          # Never touch a release that is already published.
          if gh api "repos/$R/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG is already published: refusing to change it"; exit 1
          fi

          # Exactly one draft per tag: remove drafts left by earlier (failed) runs, then create a fresh one.
          gh api "repos/$R/releases?per_page=100" --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" |
            while read -r OLD; do echo "Deleting stale draft $OLD"; gh api -X DELETE "repos/$R/releases/$OLD"; done
          ID="$(gh api -X POST "repos/$R/releases" -f tag_name="$TAG" -f name="Adar $V" -F draft=true \
            -f body="$(cat build/release-notes.md)" --jq .id)"
          echo "Created draft release $ID"

          upload() { # file → uploads it to draft $ID (replacing an asset with the same name)
            local f="$1" name; name="$(basename "$f")"
            gh api "repos/$R/releases/$ID/assets?per_page=100" --jq ".[] | select(.name == \"$name\") | .id" |
              while read -r AID; do gh api -X DELETE "repos/$R/releases/assets/$AID"; done
            gh api -X POST "https://uploads.github.com/repos/$R/releases/$ID/assets?name=$name" \
              -H "Content-Type: application/octet-stream" --input "$f" --jq '"uploaded \(.name) \(.size) \(.state)"'
          }
          for f in $FILES; do upload "release/$f"; done

          # Every asset must be fully uploaded with exactly the local size. The asset list can lag
          # behind the uploads for a few seconds, so re-check before re-uploading anything.
          for attempt in 1 2 3 4 5 6; do
            ASSETS="$(gh api "repos/$R/releases/$ID/assets?per_page=100" --jq '.[] | "\(.name) \(.size) \(.state)"')"
            BAD=""
            for f in $FILES; do
              SIZE="$(stat -c %s "release/$f")"
              printf '%s\n' "$ASSETS" | grep -qxF "$f $SIZE uploaded" || BAD="$BAD $f"
            done
            [ -z "$BAD" ] && break
            echo "Check $attempt: not ready:$BAD"; echo "Draft assets (name size state):"; printf '%s\n' "$ASSETS"
            if [ "$attempt" -ge 3 ]; then for f in $BAD; do upload "release/$f"; done; fi
            sleep 10
          done
          if [ -n "$BAD" ]; then echo "::error::Assets still missing or incomplete:$BAD"; exit 1; fi

          gh api -X PATCH "repos/$R/releases/$ID" -F draft=false -f make_latest=true --jq '"published \(.html_url)"'

      # The website (site/, Cloudflare Pages) renders the changelog and download links from GitHub
      # Releases at build time, so rebuild it now. Set the repository secret CLOUDFLARE_DEPLOY_HOOK to the
      # project's deploy hook URL; without it the step does nothing, and a failure never fails the release.
      - name: Rebuild the website
        continue-on-error: true
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then echo "No CLOUDFLARE_DEPLOY_HOOK secret: skipping the website rebuild"; exit 0; fi
          curl -fsS -X POST "$DEPLOY_HOOK" -o /dev/null && echo "Website rebuild requested"
