# Builds Adar for macOS (Apple Silicon) and publishes a GitHub Release when a version
# tag is pushed. The app's in-app updater reads the latest release, so:
#   1. bump "version" in package.json, commit
#   2. git tag v0.2.0 && git push origin main --tags
# electron-builder uploads into a DRAFT release (electron-builder.yml releaseType: draft), which the
# updater ignores; the last step checks that every asset is there and matches the local build, then
# publishes the draft with its tag pointing at the commit that was built.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Two runs for the same version (tag push + manual run) must not race on the same draft.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    # Manual runs only from main (tag pushes build the tagged commit).
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: macos-latest
    permissions:
      contents: write # create the draft release, upload assets, publish
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version $PKG"; exit 1
          fi

      - name: Build and upload to a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run release

      - name: Verify assets and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="$(node -p "require('./package.json').version")"
          TAG="v$V"
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "::error::Release $TAG is not a draft (already published?): refusing to change it"; exit 1
          fi
          ID="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)"
          FILES="Adar-$V-arm64.zip Adar-$V-arm64.dmg"
          # Every asset must exist, be fully uploaded and have exactly the size of the local build.
          # Uploads that went missing or are incomplete are re-uploaded (up to 3 attempts).
          for attempt in 1 2 3; do
            ASSETS="$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets?per_page=100" --jq '.[] | "\(.name) \(.size) \(.state)"')"
            BAD=""
            for f in $FILES; do
              SIZE="$(stat -f %z "release/$f")"
              printf '%s\n' "$ASSETS" | grep -qxF "$f $SIZE uploaded" || BAD="$BAD $f"
            done
            [ -z "$BAD" ] && break
            echo "Attempt $attempt: assets missing or incomplete:$BAD"
            echo "Draft assets (name size state):"; printf '%s\n' "$ASSETS"
            for f in $BAD; do gh release upload "$TAG" "release/$f" --clobber; done
            sleep 10
          done
          if [ -n "$BAD" ]; then
            echo "::error::Assets still missing or different from the local build:$BAD"; exit 1
          fi
          # Drop leftovers that this build did not produce (e.g. from an earlier failed run).
          gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets?per_page=100" --jq '.[] | "\(.id) \(.name)"' | while read -r AID ANAME; do
            if [ ! -f "release/$ANAME" ]; then
              echo "Removing stale asset $ANAME"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$AID"
            fi
          done
          gh release edit "$TAG" --draft=false --target "$GITHUB_SHA" --latest
