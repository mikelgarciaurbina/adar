# Builds the website in site/ (Astro, static) and publishes it to GitHub Pages:
# https://mikelgarciaurbina.github.io/adar/
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
# The roadmap page is rendered from ROADMAP.md and the changelog/download section from GitHub Releases at
# build time, so the site is rebuilt when either changes (after every successful Release run).
name: Website

on:
  push:
    branches: [main]
    paths: ['site/**', 'ROADMAP.md', '.github/workflows/pages.yml']
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: Build
        env:
          # Read-only use: lists the public releases without hitting the anonymous rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - id: deployment
        uses: actions/deploy-pages@v4
