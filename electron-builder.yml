appId: dev.adar.gitclient
productName: Adar
copyright: Copyright © 2026 Mikel García
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
# macOS assets are named by architecture only (Adar-<version>-arm64.zip): installed apps (0.5.x) and the website pick
# them that way. Windows and Linux put the system in the name and never ship a .zip or .dmg, so no macOS updater
# can mistake them for its own.
artifactName: ${productName}-${version}-${arch}.${ext}
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # Unsigned build (no Apple Developer ID). The in-app updater (src/main/updater.ts) installs the
  # .zip asset of a GitHub Release in place, so Squirrel.Mac / code signing are not required.
  identity: null
  extendInfo:
    # Lets `open -a Adar <folder>` (the adar CLI) and folders dropped on the Dock icon reach the app.
    # "Alternate" keeps Finder as the default app for folders.
    CFBundleDocumentTypes:
      - CFBundleTypeName: Folder
        CFBundleTypeRole: Viewer
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - public.folder
  extraResources:
    # `adar` command-line tool (Adar → Install Command Line Tool… links it into PATH).
    - from: resources/bin/adar
      to: bin/adar
  # Apple Silicon only (Intel Macs are not supported).
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
dmg:
  title: ${productName} ${version}
# Windows and Linux: x64 only. Unsigned like macOS (SmartScreen warns on the first run of the installer); the in-app
# updater sends these builds to the release page.
win:
  icon: build/icon.png
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  # One-click per-user installer: no administrator prompt, installs into %LOCALAPPDATA%\Programs.
  target:
    - target: nsis
      arch: [x64]
linux:
  icon: build/icon.png
  category: Development
  synopsis: Fast, visual Git client
  maintainer: Mikel García <mikelgarciaurbina@gmail.com>
  # AppImage names the architecture x86_64, deb amd64.
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
releaseInfo:
  # Body of the GitHub release (shown in the app's "What's new"). Update it before tagging a version.
  releaseNotesFile: build/release-notes.md
publish:
  provider: github
  owner: mikelgarciaurbina
  repo: adar
  # Upload to a draft: the in-app updater reads /releases/latest, which ignores drafts. The release
  # workflow publishes it once every asset is there (and never overwrites a published release's assets).
  releaseType: draft
