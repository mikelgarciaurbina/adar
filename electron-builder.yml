appId: dev.adar.gitclient
productName: Adar
copyright: Copyright © 2026 Mikel García
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
# Terminals: node-pty's native module and the helper each terminal starts through are run from disk, so they stay
# outside the archive (node-pty looks for them in app.asar.unpacked).
asarUnpack:
  - node_modules/node-pty/**
# macOS assets are named by architecture only (Adar-<version>-arm64.zip): installed apps (0.5.x) and the website pick
# them that way. Windows and Linux put the system in the name and never ship a .zip or .dmg, so no macOS updater
# can mistake them for its own.
artifactName: ${productName}-${version}-${arch}.${ext}
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # Signed with this Developer ID Application certificate only, never another one in the keychain: the release
  # workflow imports it into its own keychain (CSC_KEYCHAIN) and checks the team, local builds take it from the login
  # keychain, and builds without it stay unsigned. electron-builder's defaults do the rest: hardened runtime, its default entitlements (allow-jit,
  # which Electron needs on Apple Silicon) and notarization when the APPLE_API_KEY* variables are set. The in-app
  # updater (src/main/updater.ts) still installs the .zip asset in place.
  identity: Mikel Garcia (54RSVZ573J)
  extendInfo:
    # Lets `open -a Adar <folder>` (the adar CLI) and folders dropped on the Dock icon reach the app.
    # "Alternate" keeps Finder as the default app for folders.
    CFBundleDocumentTypes:
      - CFBundleTypeName: Folder
        CFBundleTypeRole: Viewer
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - public.folder
      # Markdown files: Adar shows their preview. "Alternate" lists Adar under the Finder's "Open With" without taking
      # them from the app they open with; "Open Markdown Files with Adar by Default…" in Adar makes that choice.
      - CFBundleTypeName: Markdown document
        CFBundleTypeRole: Viewer
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - net.daringfireball.markdown
    # The type macOS gives .md files, declared for a system where no other app has.
    UTImportedTypeDeclarations:
      - UTTypeIdentifier: net.daringfireball.markdown
        UTTypeDescription: Markdown document
        UTTypeConformsTo:
          - public.plain-text
        UTTypeTagSpecification:
          public.filename-extension:
            - md
            - markdown
            - mdown
            - mkd
            - mkdn
  extraResources:
    # `adar` command-line tool (Adar → Install Command Line Tool… links it into PATH).
    - from: resources/bin/adar
      to: bin/adar
    # Menu bar icon images (template images: the antlers, the new-commits dot, the fetch animation frames).
    - from: resources/tray
      to: tray
  # Apple Silicon only (Intel Macs are not supported).
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
dmg:
  title: ${productName} ${version}
# Windows and Linux: x64 only. Unsigned (SmartScreen warns on the first run of the installer); the in-app updater
# sends these builds to the release page.
win:
  icon: build/icon.png
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  # One-click per-user installer: no administrator prompt, installs into %LOCALAPPDATA%\Programs.
  target:
    - target: nsis
      arch: [x64]
linux:
  icon: build/icon.png
  category: Development
  synopsis: Fast, visual Git client
  maintainer: Mikel García <mikelgarciaurbina@gmail.com>
  # Markdown files: file managers list Adar under "Open with" (it shows their preview).
  mimeTypes:
    - text/markdown
  # AppImage names the architecture x86_64, deb amd64.
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
releaseInfo:
  # Body of the GitHub release (shown in the app's "What's new"). Update it before tagging a version.
  releaseNotesFile: build/release-notes.md
publish:
  provider: github
  owner: mikelgarciaurbina
  repo: adar
  # Upload to a draft: the in-app updater reads /releases/latest, which ignores drafts. The release
  # workflow publishes it once every asset is there (and never overwrites a published release's assets).
  releaseType: draft
