    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121714"/><stop offset="1" stop-color="#0A0D0C"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.55"><stop offset="0" stop-color="#C5F56A" stop-opacity="0.11"/><stop offset="1" stop-color="#C5F56A" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#glow)"/>
